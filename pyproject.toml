[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator for the 42 A-Maze-ing project"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "fralaiav"},
    {name = "yoandria"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

[tool.setuptools]
packages = ["mazegen"]

[tool.mypy]
python_version = "3.10"
exclude = ["env/", "build/", "dist/"]
